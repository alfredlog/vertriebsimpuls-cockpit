repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff - Linting
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff - Formatting
        entry: uv run ruff format
        language: system
        types: [python]
        
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key

      - id: check-added-large-files
        args: ["--maxkb=1000"]