
name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Retrieve the code
        uses: actions/checkout@vv7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install the dependencies
        run: uv sync --locked

      - name: ruff-check
        run: uv run ruff check .

      - name: ruff-format
        run: uv run  ruff format --check

      - name: run the tests
        run: uv run pytest
