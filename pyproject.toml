[project]
name = "vertriebsimpuls-cockpit"
version = "0.1.0"
description = "Prototype of an internal sales cockpit that generates daily prioritized client-product recommendations for capital markets sales teams."
readme = "README.md"
authors = [
    { name = "Alfred Mushagalusa Munganga", email = "alfredmunganga@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.11.20",
    "dash>=4.5.1",
    "duckdb>=2.0.1",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]

[tool.uv.build-backend]
module-name = "vic"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    'ignore:^The hookimpl pytest_addhooks uses old-style configuration options:pytest.PytestRemovedIn10Warning:dash\.testing\.plugin',
]
